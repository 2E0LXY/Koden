name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to deploy (defaults to main)"
        required: false
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
          # Optional: enables the M0AI AI QSO station (see deploy/README.md).
          # Deploys still succeed without it -- M0AI just stays off the air.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -z "$SSH_KEY" ] && missing="$missing VPS_SSH_KEY"
          [ -z "$SSH_HOST" ] && missing="$missing VPS_HOST"
          [ -z "$SSH_USER" ] && missing="$missing VPS_USER"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing -- add them under Settings > Secrets and variables > Actions > Repository secrets (not Environment/Codespaces/Dependabot secrets)."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Shell-quoted (not just interpolated) since GEMINI_API_KEY is a
          # secret whose contents this workflow doesn't control the shape of.
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "REPO_REF=$(printf '%q' "$DEPLOY_REF") ADDR='kodenradio.uk' ADDR_ALIASES='www.kodenradio.uk' GEMINI_API_KEY=$(printf '%q' "$GEMINI_API_KEY") bash /opt/koden/deploy/install.sh"

      # TEMPORARY -- diagnosing a real-world "no reply" report; remove once resolved.
      - name: Tail koden-server logs
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "journalctl -u koden-server -n 100 --no-pager"
