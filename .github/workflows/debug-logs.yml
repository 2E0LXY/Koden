name: Debug VPS Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Number of journalctl lines to show"
        required: false
        default: "200"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Tail koden-server logs
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          LINES: ${{ github.event.inputs.lines || '200' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "journalctl -u koden-server -n $LINES --no-pager"
