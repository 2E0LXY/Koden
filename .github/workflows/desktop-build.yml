name: Build Desktop Client

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update a GitHub Release with the built artifacts"
        type: boolean
        default: true

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Configure
        run: cmake -S apps/desktop -B apps/desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build apps/desktop/build -j"$(nproc)" --target KodenDesktop koden_net_smoketest

      # Same headless verification as the sandboxed build that first proved
      # this out: the network layer against the real production server, no
      # display required.
      - name: Verify network layer against production
        run: ./apps/desktop/build/koden_net_smoketest wss://kodenradio.uk/ws M0CI IO91WM

      - name: Package .deb
        run: |
          cd apps/desktop/build
          cpack -G DEB
          ls -la *.deb

      - name: Install and sanity-check the package
        run: |
          sudo dpkg -i apps/desktop/build/*.deb
          which koden-desktop
          sudo apt-get install -y -qq xvfb
          timeout 6 xvfb-run -a koden-desktop || [ $? -eq 124 ]

      - uses: actions/upload-artifact@v4
        with:
          name: koden-desktop-deb
          path: apps/desktop/build/*.deb

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S apps/desktop -B apps/desktop/build -A x64

      - name: Build
        run: cmake --build apps/desktop/build --config Release --target KodenDesktop koden_net_smoketest

      - name: Verify network layer against production
        run: apps\desktop\build\Release\koden_net_smoketest.exe wss://kodenradio.uk/ws M0CI IO91WM
        shell: cmd

      - name: Package zip
        run: |
          cd apps/desktop/build
          cpack -G ZIP -C Release
          Get-ChildItem *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: koden-desktop-win64
          path: apps/desktop/build/*.zip

  release:
    needs: [linux-deb, windows-exe]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read version
        id: version
        run: echo "version=$(grep -oP 'project\(KodenDesktop VERSION \K[0-9.]+' apps/desktop/CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v${{ steps.version.outputs.version }}"
          find artifacts -type f \( -name '*.deb' -o -name '*.zip' \)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/koden-desktop-deb/*.deb artifacts/koden-desktop-win64/*.zip --clobber
          else
            gh release create "$tag" artifacts/koden-desktop-deb/*.deb artifacts/koden-desktop-win64/*.zip \
              --title "Koden Desktop v${{ steps.version.outputs.version }}" \
              --notes "Native (JUCE/C++) desktop client -- phase 1: network/status layer only, no audio engine or full radio panel yet. See apps/desktop/README.md for scope and build instructions." \
              --prerelease
          fi
